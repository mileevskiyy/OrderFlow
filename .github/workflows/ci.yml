name: OrderFlow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orderflow_test
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend and verify H2 workflow
        run: ./scripts/build.sh -B
      - name: Verify order invariants against PostgreSQL
        run: ./mvnw -B test -Dtest=OperationsTests,ReservationExpiryTests
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/orderflow_test
          DB_USER: orderflow
          DB_PASSWORD: ci-test-password
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify automatic reservation expiry in browser
        run: npm run test:expiry
        working-directory: frontend
      - name: Check out pinned QualityHub integration target
        uses: actions/checkout@v4
        with:
          repository: mileevskiyy/QualityHub
          ref: ffa30ef4822f01b6b1c2bb404836a8f76c87af19
          path: .qualityhub
          persist-credentials: false
      - name: Install integration target dependencies
        run: npm ci --prefix .qualityhub
      - name: Verify actual browser evidence delivery to QualityHub
        run: node scripts/qualityhub-ci.mjs
        env:
          QUALITYHUB_CHECKOUT: .qualityhub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orderflow-test-evidence
          include-hidden-files: true
          retention-days: 7
          path: |
            .qualityhub-evidence
            backend/target/surefire-reports
            frontend/playwright-report
