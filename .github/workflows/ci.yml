name: OrderFlow checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orderflow_test
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend and verify H2 workflow
        run: ./scripts/build.sh -B
      - name: Verify order invariants against PostgreSQL
        run: ./mvnw -B test -Dtest=OperationsTests
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/orderflow_test
          DB_USER: orderflow
          DB_PASSWORD: ci-test-password
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: orderflow-test-evidence
          path: |
            backend/target/surefire-reports
            frontend/playwright-report
