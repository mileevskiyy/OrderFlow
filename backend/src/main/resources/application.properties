spring.application.name=OrderFlow
server.port=${PORT:3200}
server.address=${HOST:127.0.0.1}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/orderflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=2h
orderflow.username=${OPERATOR_USERNAME:operator}
orderflow.password=${OPERATOR_PASSWORD:local-demo-password}
orderflow.production=${PRODUCTION:false}
orderflow.seed=${SEED_DEMO:true}

# Reject fractional JSON values for integer quantities and cent-denominated amounts.
spring.jackson.deserialization.accept-float-as-int=false
